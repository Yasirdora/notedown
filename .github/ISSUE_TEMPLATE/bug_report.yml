name: Bug report
description: Report a reproducible Notedown or documentation problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use invented example text. Do not include private notes or security vulnerabilities."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Writing or formatting
        - Import or export
        - Saving or local library
        - Navigation or accessibility
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and app URL
      description: Include browser version and Page, Markdown, Split, or Read view if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a small, invented Markdown example when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any visible save or export warning.
    validations:
      required: true
